<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodrigo Portugal</title>
  <meta name="description" content="Estudiante de Ingeniería Informática en la Universidad de Burgos, interesado en inteligencia artificial y desarrollo de software.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231554f5'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-weight='700' font-size='28' fill='white'%3ERP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <header class="topbar">
    <nav class="nav wrap">
      <a class="brand" href="#top" aria-label="Inicio">RP</a>
      <ul class="nav-links">
        <li><a href="#about" data-i18n="nav.about"></a></li>
        <li><a href="#education" data-i18n="nav.education"></a></li>
        <li><a href="#experience" data-i18n="nav.experience"></a></li>
        <li><a href="#skills" data-i18n="nav.skills"></a></li>
        <li><a href="#projects" data-i18n="nav.projects"></a></li>
      </ul>
      <div class="nav-actions">
        <button class="pill-btn" id="lang-toggle" type="button" aria-label="Cambiar idioma / Change language">EN</button>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Cambiar tema">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero wrap">
      <div class="hero-grid">
        <div>
          <p class="status"><span class="dot"></span><span id="status"></span></p>
          <h1 id="name"></h1>
          <p class="headline" id="headline"></p>
          <p class="location" id="location"></p>
          <ul class="tags" id="tags"></ul>
          <div class="cta" id="cta"></div>
        </div>
        <div class="monogram">
          <img src="img/foto.jpg" alt="Foto de Rodrigo Portugal" width="172" height="172">
        </div>
      </div>
    </section>

    <section class="section wrap" id="about">
      <h2 class="section-title"><span class="num">01</span><span data-i18n="nav.about"></span></h2>
      <div class="about" id="about-text"></div>
    </section>

    <section class="section wrap" id="education">
      <h2 class="section-title"><span class="num">02</span><span data-i18n="nav.education"></span></h2>
      <div class="timeline" id="education-list"></div>
      <h3 class="sub-title" data-i18n="courses.title"></h3>
      <div class="courses" id="courses"></div>
    </section>

    <section class="section wrap" id="experience">
      <h2 class="section-title"><span class="num">03</span><span data-i18n="nav.experience"></span></h2>
      <div class="timeline" id="experience-list"></div>
    </section>

    <section class="section wrap" id="skills">
      <h2 class="section-title"><span class="num">04</span><span data-i18n="nav.skills"></span></h2>
      <div class="skills" id="skills-list"></div>
    </section>

    <section class="section wrap" id="projects">
      <h2 class="section-title"><span class="num">05</span><span data-i18n="nav.projects"></span></h2>
      <p class="section-lead" data-i18n="projects.lead"></p>
      <div class="filters" id="project-filters" role="tablist"></div>
      <div class="projects" id="projects-list"></div>
    </section>
  </main>

  <footer class="footer wrap">
    <p><span id="footer-name"></span> · <span id="year"></span></p>
    <div class="footer-links" id="footer-links"></div>
  </footer>

  <script src="data.js?v=6"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
